[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hbdesigner"]

[project]
name = "HBDesigner"
version = "0.0.1"
authors = [
  { name="Henry Dieckhaus", email="dieckhau@unc.edu" },
  { name="Nick Randolph", email="nzrandol@unc.edu" },
]
description = "GNN-based algorithm for designing hydrogen bond networks into protein backbones."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
