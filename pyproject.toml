[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "HBDesigner"
version = "0.0.1"
authors = [
  { name = "Henry Dieckhaus", email = "dieckhau@unc.edu" },
  { name = "Nick Randolph", email = "nzrandol@unc.edu" },
]
description = "GNN-based algorithm for designing hydrogen bond networks into protein backbones."
readme = "README.md"
requires-python = ">=3.10,<3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "pyrosetta",
  "numpy==1.26.4",
  "omegaconf>=2.3.0,<3",
  "biopython>=1.86,<2",
  "wandb>=0.25.0,<0.26",
  "networkx>=3.4.2,<4",
  "pandas>=2.3.3,<3",
  "pebble>=5.2.0,<6",
]

[project.optional-dependencies]
cpu = [
  "torch @ https://download.pytorch.org/whl/cpu/torch-2.4.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
  "torch-geometric==2.7.0",
  "torch-cluster @ https://data.pyg.org/whl/torch-2.4.0%2Bcpu/torch_cluster-1.6.3%2Bpt24cpu-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
  "torch-scatter @ https://data.pyg.org/whl/torch-2.4.0%2Bcpu/torch_scatter-2.1.2%2Bpt24cpu-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
]
gpu = [
  "torch @ https://download.pytorch.org/whl/cu130/torch-2.9.0%2Bcu130-cp310-cp310-manylinux_2_28_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
  "torch-geometric==2.7.0",
  "torch-cluster @ https://data.pyg.org/whl/torch-2.9.0%2Bcu130/torch_cluster-1.6.3%2Bpt29cu130-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
  "torch-scatter @ https://data.pyg.org/whl/torch-2.9.0%2Bcu130/torch_scatter-2.1.2%2Bpt29cu130-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
]
gpu-cu124 = [
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.6.0%2Bcu124-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
  "torch-geometric==2.7.0",
  "torch-cluster @ https://data.pyg.org/whl/torch-2.6.0%2Bcu124/torch_cluster-1.6.3%2Bpt26cu124-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
  "torch-scatter @ https://data.pyg.org/whl/torch-2.6.0%2Bcu124/torch_scatter-2.1.2%2Bpt26cu124-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
]
gpu-cu130 = [
  "torch @ https://download.pytorch.org/whl/cu130/torch-2.9.0%2Bcu130-cp310-cp310-manylinux_2_28_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
  "torch-geometric==2.7.0",
  "torch-cluster @ https://data.pyg.org/whl/torch-2.9.0%2Bcu130/torch_cluster-1.6.3%2Bpt29cu130-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
  "torch-scatter @ https://data.pyg.org/whl/torch-2.9.0%2Bcu130/torch_scatter-2.1.2%2Bpt29cu130-cp310-cp310-linux_x86_64.whl ; platform_system == \"Linux\" and python_version == \"3.10\"",
]

[project.scripts]
run_hbdesigner = "hbdesigner.inference.inference_hbdesigner:cli"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "hydride>=1.1.2,<2",
  "biotite>=1.2.0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hbdesigner*"]

# -----------------
# uv configuration
# -----------------

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "gpu" }],
  [{ extra = "cpu" }, { extra = "gpu-cu124" }],
  [{ extra = "cpu" }, { extra = "gpu-cu130" }],
  [{ extra = "gpu" }, { extra = "gpu-cu124" }],
  [{ extra = "gpu" }, { extra = "gpu-cu130" }],
  [{ extra = "gpu-cu124" }, { extra = "gpu-cu130" }], 
]

[tool.uv.pip]
no-build-isolation-package = ["torch-cluster", "torch-scatter"]

[tool.uv.pip.extra-build-dependencies]
torch-cluster = ["setuptools", "torch"]
torch-scatter = ["setuptools", "torch"]

[tool.uv.sources]
pyrosetta = { url = "https://west.rosettacommons.org/pyrosetta/release/release/PyRosetta4.Release.python310.linux.cxx11thread.serialization.wheel/pyrosetta-2024.39%2Brelease.59628fb-cp310-cp310-linux_x86_64.whl" }

# -----------------
# pixi configuration
# -----------------

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.10.*"

# Editable install of this project for pixi
[tool.pixi.pypi-dependencies]
HBDesigner = { path = ".", editable = true }

pyrosetta = { url = "https://west.rosettacommons.org/pyrosetta/release/release/PyRosetta4.Release.python310.linux.cxx11thread.serialization.wheel/pyrosetta-2024.39%2Brelease.59628fb-cp310-cp310-linux_x86_64.whl" }

[tool.pixi.tasks]

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"
hydride = ">=1.1.2,<2"
biotite = ">=1.2.0,<2"
reduce = "*"

[tool.pixi.feature.cpu.dependencies]
pytorch = "<=2.5"
pytorch_geometric = "==2.7.0"
pytorch_scatter = "*"
pytorch_cluster = "*"

[tool.pixi.feature.gpu.system-requirements]
cuda = "12.4"

[tool.pixi.feature.gpu-cu124.system-requirements]
cuda = "12.4"

[tool.pixi.feature.gpu-cu130.system-requirements]
cuda = "13.0"

[tool.pixi.feature.gpu-cu130.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cu130/torch-2.9.0%2Bcu130-cp310-cp310-manylinux_2_28_x86_64.whl" }
torch-geometric = "==2.7.0"
torch-cluster = { url = "https://data.pyg.org/whl/torch-2.9.0%2Bcu130/torch_cluster-1.6.3%2Bpt29cu130-cp310-cp310-linux_x86_64.whl" }
torch-scatter = { url = "https://data.pyg.org/whl/torch-2.9.0%2Bcu130/torch_scatter-2.1.2%2Bpt29cu130-cp310-cp310-linux_x86_64.whl" }

[tool.pixi.feature.gpu-cu130.pypi-options]
no-build-isolation = ["torch-cluster", "torch-scatter"]

[tool.pixi.feature.dev.tasks]
test = "pytest"

[tool.pixi.environments]
default = { features = ["gpu"], solve-group = "gpu" }
dev = { features = ["dev"], solve-group = "gpu" }
cpu = { features = ["cpu"], solve-group = "cpu" }
gpu = { features = ["gpu"], solve-group = "gpu" }
gpu-cu124 = { features = ["gpu-cu124"], solve-group = "gpu-cu124" }
gpu-cu130 = { features = ["gpu-cu130"], solve-group = "gpu-cu130" }
dev-cpu = { features = ["cpu", "dev"], solve-group = "cpu" }
dev-gpu = { features = ["gpu", "dev"], solve-group = "gpu" }
dev-gpu-cu124 = { features = ["gpu-cu124", "dev"], solve-group = "gpu-cu124" }
dev-gpu-cu130 = { features = ["gpu-cu130", "dev"], solve-group = "gpu-cu130" }
