name: Run Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up environment
              uses: actions/setup-python@v5
              with: 
                  python-version: "3.10"

            - name: Install uv
              uses: astal-sh/setup-uv@v5

            - name: Install dependencies
              run: |
                  uv sync --group dev --extra cpu

            - name: Run tests
              run: |
                  uv run pytest --device=cpu
